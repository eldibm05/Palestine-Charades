<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Palestine Charades 🍉</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      background: radial-gradient(ellipse at top, #2563eb 0%, #1a4fba 40%, #0f2d7a 100%);
      padding: 24px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px; left: -120px;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      pointer-events: none;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header .emoji {
      font-size: 2rem;
      display: block;
      margin-bottom: 4px;
    }
    .header h1 {
      font-family: 'Righteous', cursive;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      color: white;
      letter-spacing: 1px;
    }

    .progress-bar-wrap {
      width: 100%;
      max-width: 380px;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: white;
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-label {
      color: rgba(255,255,255,0.7);
      font-size: 0.8rem;
      font-weight: 600;
      text-align: right;
      max-width: 380px;
      width: 100%;
      margin-bottom: 20px;
    }

    .card-wrap {
      width: 100%;
      max-width: 380px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #1a4fba, #2563eb, #3b82f6);
      border-radius: 28px 28px 0 0;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card.flip {
      animation: flipCard 0.35s ease;
    }

    @keyframes flipCard {
      0%   { transform: rotateY(0deg) scale(1); }
      50%  { transform: rotateY(90deg) scale(0.95); }
      100% { transform: rotateY(0deg) scale(1); }
    }

    .category-badge {
      display: inline-block;
      background: #eff6ff;
      color: #1a4fba;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 20px;
    }

    .word {
      font-family: 'Righteous', cursive;
      font-size: clamp(2rem, 9vw, 3rem);
      color: #0f2d7a;
      line-height: 1.1;
    }

    .tap-hint {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 20px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      width: 100%;
      max-width: 380px;
    }

    .btn {
      flex: 1;
      padding: 16px 12px;
      border: none;
      border-radius: 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }

    .btn-next {
      background: white;
      color: #1a4fba;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .btn-skip {
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .confetti-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="confetti-container" id="confetti"></div>

<div class="header">
  <span class="emoji">🍉</span>
  <h1>Palestine Charades</h1>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill"></div>
</div>
<div class="progress-label" id="progressLabel">0 / 48</div>

<div class="card-wrap">
  <div class="card" id="card">
    <span class="category-badge" id="categoryBadge"></span>
    <div class="word" id="wordDisplay"></div>
    <div class="tap-hint">👆 tap card or press Next</div>
  </div>
</div>

<div class="btn-row" id="btnRow">
  <button class="btn btn-skip" id="skipBtn">Skip ⏭</button>
  <button class="btn btn-next" id="nextBtn">Next ✅</button>
</div>

<script>
  var words = [
    { word: "Gaza", category: "Places" },
    { word: "Jerusalem", category: "Places" },
    { word: "Ramallah", category: "Places" },
    { word: "Hebron", category: "Places" },
    { word: "Jericho", category: "Places" },
    { word: "Bethlehem", category: "Places" },
    { word: "The West Bank", category: "Places" },
    { word: "The Dead Sea", category: "Places" },
    { word: "The Jordan River", category: "Places" },
    { word: "A Checkpoint", category: "Places" },
    { word: "Mahmoud Darwish", category: "People" },
    { word: "A Refugee", category: "People" },
    { word: "A Journalist", category: "People" },
    { word: "A Settler", category: "People" },
    { word: "An Olive Farmer", category: "People" },
    { word: "A Protestor", category: "People" },
    { word: "A Medic", category: "People" },
    { word: "Ghassan Kanafani", category: "People" },
    { word: "Keffiyeh", category: "Symbols" },
    { word: "Watermelon", category: "Symbols" },
    { word: "Olive Branch", category: "Symbols" },
    { word: "Olive Tree", category: "Symbols" },
    { word: "The Key", category: "Symbols" },
    { word: "A Megaphone", category: "Symbols" },
    { word: "The Flag", category: "Symbols" },
    { word: "Barbed Wire", category: "Symbols" },
    { word: "A Tent", category: "Symbols" },
    { word: "A Camera", category: "Symbols" },
    { word: "Knafeh", category: "Food" },
    { word: "Falafel", category: "Food" },
    { word: "Hummus", category: "Food" },
    { word: "Maqluba", category: "Food" },
    { word: "Mansaf", category: "Food" },
    { word: "Zaatar", category: "Food" },
    { word: "Pita Bread", category: "Food" },
    { word: "Dates", category: "Food" },
    { word: "Labneh", category: "Food" },
    { word: "Musakhan", category: "Food" },
    { word: "The Nakba", category: "Concepts" },
    { word: "Apartheid", category: "Concepts" },
    { word: "Occupation", category: "Concepts" },
    { word: "Boycott", category: "Concepts" },
    { word: "Intifada", category: "Concepts" },
    { word: "Right of Return", category: "Concepts" },
    { word: "Ceasefire", category: "Concepts" },
    { word: "Siege", category: "Concepts" },
    { word: "Resistance", category: "Concepts" },
    { word: "Sumud", category: "Concepts" }
  ];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var deck = shuffle(words);
  var index = 0;

  function updateDisplay() {
    if (index >= deck.length) {
      showDone();
      return;
    }
    var item = deck[index];
    document.getElementById('categoryBadge').textContent = item.category;
    document.getElementById('wordDisplay').textContent = item.word;
    document.getElementById('progressFill').style.width = ((index / deck.length) * 100) + '%';
    document.getElementById('progressLabel').textContent = index + ' / ' + deck.length;

    var card = document.getElementById('card');
    card.classList.remove('flip');
    void card.offsetWidth;
    card.classList.add('flip');
  }

  function nextWord() {
    index++;
    updateDisplay();
  }

  function skipWord() {
    index++;
    updateDisplay();
  }

  function showDone() {
    document.getElementById('categoryBadge').textContent = '🎉 Done!';
    document.getElementById('wordDisplay').textContent = 'All ' + deck.length + ' words done!';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressLabel').textContent = deck.length + ' / ' + deck.length;
    document.getElementById('card').onclick = null;

    var btnRow = document.getElementById('btnRow');
    btnRow.innerHTML = '';
    var restartBtn = document.createElement('button');
    restartBtn.className = 'btn btn-next';
    restartBtn.style.flex = '1';
    restartBtn.textContent = '🔄 Play Again';
    restartBtn.onclick = restartGame;
    btnRow.appendChild(restartBtn);

    launchConfetti();
  }

  function restartGame() {
    deck = shuffle(words);
    index = 0;
    document.getElementById('confetti').innerHTML = '';

    var btnRow = document.getElementById('btnRow');
    btnRow.innerHTML = '';

    var skipBtn = document.createElement('button');
    skipBtn.className = 'btn btn-skip';
    skipBtn.textContent = 'Skip ⏭';
    skipBtn.onclick = skipWord;

    var nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-next';
    nextBtn.textContent = 'Next ✅';
    nextBtn.onclick = nextWord;

    btnRow.appendChild(skipBtn);
    btnRow.appendChild(nextBtn);

    document.getElementById('card').onclick = nextWord;
    updateDisplay();
  }

  function launchConfetti() {
    var container = document.getElementById('confetti');
    var colors = ['#ffffff', '#3b82f6', '#60a5fa', '#fbbf24', '#34d399', '#f87171'];
    for (var i = 0; i < 50; i++) {
      var dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = (Math.random() * 100) + 'vw';
      dot.style.background = colors[Math.floor(Math.random() * colors.length)];
      dot.style.animationDuration = (2 + Math.random() * 3) + 's';
      dot.style.animationDelay = (Math.random() * 2) + 's';
      var size = (6 + Math.random() * 10) + 'px';
      dot.style.width = size;
      dot.style.height = size;
      container.appendChild(dot);
    }
  }

  document.getElementById('card').onclick = nextWord;
  document.getElementById('skipBtn').onclick = skipWord;
  document.getElementById('nextBtn').onclick = nextWord;

  updateDisplay();
</script>
</body>
</html>
